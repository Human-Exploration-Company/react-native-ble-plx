name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - run: nix flake check --no-build --all-systems
      - run: nix develop --command bun install --frozen-lockfile
      - run: nix develop --command bun run verify
      - run: nix develop --command bun run doctor
      - run: nix develop --command bun run export:native
      - run: nix develop --command bun run verify:package
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - run: nix develop --command bun install --frozen-lockfile
      - run: nix develop --command bun run --cwd example prebuild --platform android
      - name: Compile debug and minified release
        run: nix develop .#native --command bash -c 'cd example/android && ./gradlew :app:assembleDebug :app:assembleRelease -Pandroid.enableMinifyInReleaseBuilds=true --console=plain'
  apple:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - run: nix develop --command bun install --frozen-lockfile
      - run: nix develop --command bun run --cwd example prebuild --platform ios
      - name: Install pods
        run: nix develop .#native --command bash -c 'cd example/ios && pod install'
      - name: Compile Swift macros and simulator app
        run: >-
          nix develop .#native --command xcodebuild
          -workspace example/ios/BLEPLX.xcworkspace -scheme BLEPLX
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath dist/DerivedData CODE_SIGNING_ALLOWED=NO build
