name: Bug report
description: Report a reproducible issue in the Expo fork.
body:
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Fork commit, Expo SDK, Bun version, device and OS version.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal code or repository, steps, expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and validation
      description: Expo Doctor, native build logs and BLE error details. Redact device identifiers as needed.
